name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests for the checker (standard library)
        run: python -m unittest discover -s tests -v
      - name: Page, licence, metadata and wording checks
        run: python scripts/check_page.py
      - name: External links answer
        if: matrix.python-version == '3.13'
        run: python scripts/check_page.py --online
